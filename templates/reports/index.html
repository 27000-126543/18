{% extends "base.html" %}
{% block title %}报表中心{% endblock %}
{% block header_title %}REPORTS{% endblock %}
{% block header_sub %}日报、月报与数据分析报告{% endblock %}
{% block content %}

<div class="page-header">
  <h1 class="page-title">报表中心</h1>
  <div class="page-subtitle">查看和导出设备维护管理日报与月度分析报告</div>
</div>

<div class="grid-2">
  <a href="{{ url_for('reports_daily') }}" style="text-decoration:none;">
    <div class="card" style="height:100%; cursor:pointer; transition:all 0.3s;">
      <div class="card-body" style="padding:40px; text-align:center;">
        <div style="font-size:56px; margin-bottom:16px;">📊</div>
        <div style="font-size:20px; font-weight:600; color:var(--cyan-primary); margin-bottom:8px;">日报</div>
        <div style="color:var(--text-dim); font-size:13px;">每日设备故障率、MTTR、维护成本统计</div>
      </div>
    </div>
  </a>
  <a href="{{ url_for('reports_monthly') }}" style="text-decoration:none;">
    <div class="card" style="height:100%; cursor:pointer; transition:all 0.3s;">
      <div class="card-body" style="padding:40px; text-align:center;">
        <div style="font-size:56px; margin-bottom:16px;">📈</div>
        <div style="font-size:20px; font-weight:600; color:var(--cyan-primary); margin-bottom:8px;">月报</div>
        <div style="color:var(--text-dim); font-size:13px;">设备生命周期成本分析与维护成效</div>
      </div>
    </div>
  </a>
</div>

{% endblock %}
{% block scripts %}{% endblock %}
